<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP | To-Do </title>

    <link href="./assets/fonts/space-grotesk-v22-latin-600.woff2" type="font/woff2" rel="preload" as="font" crossorigin>
    <link href="./assets/fonts/space-grotesk-v22-latin-700.woff2" type="font/woff2" rel="preload" as="font" crossorigin>

</head>

<body class="dark">

    <nav>
        <a data-action="switch-project" href="#">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
                <path
                    d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z" />
            </svg>
            All Tasks
        </a>
        <button data-action="display-projects" command="show-modal" commandfor="project-selection-dialog">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
                <path
                    d="M127-167q-47-47-47-113t47-113q47-47 113-47t113 47q47 47 47 113t-47 113q-47 47-113 47t-113-47Zm480 0q-47-47-47-113t47-113q47-47 113-47t113 47q47 47 47 113t-47 113q-47 47-113 47t-113-47Zm-310.5-56.5Q320-247 320-280t-23.5-56.5Q273-360 240-360t-56.5 23.5Q160-313 160-280t23.5 56.5Q207-200 240-200t56.5-23.5Zm480 0Q800-247 800-280t-23.5-56.5Q753-360 720-360t-56.5 23.5Q640-313 640-280t23.5 56.5Q687-200 720-200t56.5-23.5ZM367-567q-47-47-47-113t47-113q47-47 113-47t113 47q47 47 47 113t-47 113q-47 47-113 47t-113-47Zm169.5-56.5Q560-647 560-680t-23.5-56.5Q513-760 480-760t-56.5 23.5Q400-713 400-680t23.5 56.5Q447-600 480-600t56.5-23.5ZM480-680Zm240 400Zm-480 0Z" />
            </svg>
            Projects
        </button>
        <button data-action="filter">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
                <path d="M400-240v-80h160v80H400ZM240-440v-80h480v80H240ZM120-640v-80h720v80H120Z" />
            </svg>
            Filter
        </button>
        <button data-action="search">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
                <path
                    d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z" />
            </svg>
            Search
        </button>
    </nav>

    <dialog id="project-selection-dialog" class="project-selection-dialog" closedby="any">
        <div class="project-container"></div>
        <button class="small btn" data-action="add-project" command="show-modal"
            commandfor="project-creation-dialog">Add Project</button>
    </dialog>

    <dialog id="project-creation-dialog" class="project-creation-dialog" closedby="any">
        <form method="dialog">
            <fieldset>
                <ul>
                    <li>
                        <label for="project-name">Name</label>
                        <input type="text" name="project-name" id="project-name-name" placeholder="f.e.: Household"
                            minlength="3" maxlength="20" required>
                    </li>
                    <li>
                        <label for="project-desc">Description</label>
                        <input type="text" name="project-desc" id="project-desc"
                            placeholder="f.e.: Collection of household chores">
                    </li>
                </ul>
            </fieldset>
            <button class="small btn" type="submit">Add Project</button>
        </form>
    </dialog>

    <main>

        <dialog id="task-creation-dialog" class="task-creation-dialog" closedby="any">
            <form method="dialog">
                <fieldset>
                    <ul>
                        <li>
                            <label for="task-name">Name</label>
                            <input type="text" name="task-name" id="task-name" placeholder="f.e.: Do dishes"
                                minlength="3" maxlength="20" required>
                        </li>
                        <li>
                            <label for="task-desc">Description</label>
                            <input type="text" name="task-desc" id="task-desc" placeholder="f.e.: Wash the plates">
                        </li>
                        <li>
                            <label for="task-due-date">Due-Date</label>
                            <input type="datetime-local" name="task-due-date" id="task-due-date">
                        </li>
                        <li>
                            <label for="task-priority">Select the Priority Level</label>
                            <select class="small btn dropdown" name="task-priority" id="task-priority">
                                <option value="high">High</option>
                                <option value="medium" selected>Medium</option>
                                <option value="low">Low</option>
                            </select>
                        </li>
                    </ul>
                </fieldset>
                <button class="small btn" type="submit">Add task</button>
            </form>
        </dialog>

        <dialog id="project-move-dialog" class="project-move-dialog" closedby="any">
            <div class="project-container">
            </div>
        </dialog>

        <div class="content-container" data-label="content-container">
            <div class="active empty content" data-label="empty-content">
                <h1>Welcome to <span class="foreground primary">Taskify!</span></h1>
                <h2>It seems you do not have any tasks stored currently. Do you wanna <span
                        class="foreground primary">add a
                        new task?</span></h2>
                <button class="btn" data-action="open-add-task-dialog" type="button" command="show-modal"
                    commandfor="task-creation-dialog">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                        fill="#e3e3e3">
                        <path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z" />
                    </svg>
                </button>
            </div>
            <div class="populated content" data-label="populated-content">
                <div class="top">
                    <h1 class="project-name" data-label="project-name">All Tasks</h1>
                    <div class="legend">
                        <p class="foreground destructive">● High Priority</p>
                        <p class="foreground primary">● Medium Priority</p>
                        <p class="foreground secondary">● Low Priority</p>
                    </div>
                </div>
                <div class="task-container" data-label="task-container">
                </div>
                <div class="btn-container">
                    <button class="btn" type="button" data-action="open-move-dialog" command="show-modal"
                        commandfor="project-move-dialog">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                            fill="#e3e3e3">
                            <path
                                d="M806-440H320v-80h486l-62-62 56-58 160 160-160 160-56-58 62-62ZM600-600v-160H200v560h400v-160h80v160q0 33-23.5 56.5T600-120H200q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h400q33 0 56.5 23.5T680-760v160h-80Z" />
                        </svg>
                    </button>
                    <button class="btn" data-action="delete-forever">
                        <svg width="24px" height="24px" viewBox="0 -960 960 960">
                            <path
                                d="m376-300 104-104 104 104 56-56-104-104 104-104-56-56-104 104-104-104-56 56 104 104-104 104 56 56Zm-96 180q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520Zm-400 0v520-520Z">
                            </path>
                        </svg>
                    </button>
                    <button class="btn" data-action="delete">
                        <svg width="24px" height="24px" viewBox="0 -960 960 960">
                            <path
                                d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z">
                            </path>
                        </svg>
                    </button>
                    <button class="btn" data-action="select-tasks">Select Tasks</button>
                    <button class="btn" data-action="open-add-task-dialog" command="show-modal"
                        commandfor="task-creation-dialog">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                            fill="#e3e3e3">
                            <path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z" />
                    </button>
                </div>
            </div>
        </div>

    </main>

</body>

</html>
